[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nextgen_train"
dynamic = ["version"] # Tells Hatchling to calculate this dynamically
description = "LLM training for NextGen"
authors = [{name = "Mauricio Munoz", email = "mauricio.munoz@ai.se"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.14"

# Main dependencies
dependencies = [
    "hydra-core>=1.3.2",
    "loguru>=0.7.2",
    "python-dotenv>=1.2.1",
    "transformers[torch]>=4.55.2",
    "sentence-transformers>=3.0.0",
    "nextgen_framework",
    "mlflow==2.22.2", # Need to work with Gitlab integration
]

[project.urls]
Homepage = "https://gitlab.mgmt.ai.se/nextgeninfra/nextgen-train"
Documentation = "https://pages.gitlab.mgmt.ai.se/nextgeninfra/nextgen-train"

[dependency-groups]
data = [
  "tqdm>=4.67.3",
  #"vllm>=0.10.1", # Add on demand, incompatible together with optimum-habana's requirement for transformers.
  "datasets>=4.0.0",
  "polars>=1.39.0",
  "pyarrow>=19.0.1",
  "python-heapq>=0.0.1",
]
training = [
    "accelerate>=1.10.0",
    "mteb>=1.38.42",
    "datasets>=4.0.0",
]
gaudi = [
    "torch==2.10.0", # For safety, match this to whatever Python is installed in the Gaudi Docker image
    "optimum-habana==1.20.0", # Works on driver v1.23, and 1.24 (despite warnings)
]
inference = [
    "google-generativeai>=0.8.5",
    "matplotlib>=3.10.7",
    "mteb>=1.38.42",
]
init = [
    "click>=8.1.8",
    "jinja2>=3.1.6",
]
dev = [
    "pytest>=8.3.3",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "mypy>=1.12.1",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "isort>=5.13.2",
    "pyupgrade>=3.19.0",
    "pre-commit>=4.0.1",
    "poethepoet>=0.29.0",
    "coverage>=7.6.4",
    "mkdocs-material>=9.5.42",
    "mike>=2.1.3",
    "genbadge[coverage,tests]>=1.1.1",
]

[tool.uv.sources]
nextgen_framework = { index = "nextgen" }

[[tool.uv.index]]
name = "nextgen"
url = "https://gitlab.mgmt.ai.se/api/v4/projects/63/packages/pypi/simple"


### Tools config

[tool.hatch.version]
source = "vcs" # Use git tags for versioning

[tool.hatch.build.targets.wheel]
packages = ["nextgen_train"]

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--cov",
  "--full-trace",
  "--cov-config=pyproject.toml",
  "--capture=tee-sys",
  "--html=docs/exported/pytest.html",
  "--junit-xml=docs/exported/pytest.xml",
  "--self-contained-html",
  "--showlocals",
]
testpaths = ["test"]
log_cli = true
log_cli_level = 10

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_empty = true

[tool.coverage.run]
branch = true
source = ["nextgen_train"]

[tool.coverage.html]
directory = "docs/exported/coverage"

[tool.coverage.xml]
output = "docs/exported/coverage.xml"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
sections = "FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
pretty = true
show_error_context = true
show_traceback = true

[tool.ruff]
fix = true
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = [
  "PLR",    # pylint recommendations
  "D104",   # Missing docstring in public package
  "ANN101", # Missing type annotation: <name> in method
  "ANN002", # Missing type annotation:  *args
  "ANN003", # Missing type annotation: **kwargs
  "C901",   # Functions too complex
  "S101",   # use of assert - useful for mypy
]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "C",    # flake8-comprehensions
  "B",    # flake8-bugbear
  "S",    # flake8-bandit
  "A",    # flake8-builtins
  "INP",  # flake8-no-pep420
  "PIE",  # flake8-pie
  "PL",   # pylint
]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["S101"]
"scripts/**/*.py" = ["INP001"]
"scripts/data_processing/generate_questions.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.poe]
shell_interpreter = "bash"
verbosity = 1

# Clean temporary files from the repo
[tool.poe.tasks.clean]
shell = """
  rm -rf \
    .coverage \
    .mypy_cache \
    .pytest_cache \
    .ruff_cache \
    .site \
    public \
    **/__pycache__ \
    docs/exported \
    */configs/__pycache__ \
"""

# Run unit testing using pytest. Generate a coverage report in different output formats
[tool.poe.tasks.test]
sequence = [
  { cmd = "pytest -n ${cpus} ${test}" },
  { cmd = "coverage xml" },
  { cmd = "coverage html" },
  { cmd = "coverage report" },
]
help = "Run unit testing and generate coverage report"
args = [
  { name = "cpus", multiple = false, positional = true, default = 1, help = "Number of cpus to use for xdist" },
  { name = "test", multiple = true, positional = true, default = "test/unit", help = "Unit tests to run" }
]

# Export test artifacts
[tool.poe.tasks.export-test-artifacts]
sequence = [
  { cmd = "genbadge tests -i ${directory}/pytest.xml -o ${directory}/tests.svg" },
  { cmd = "genbadge coverage -i ${directory}/coverage.xml -o ${directory}/coverage.svg" },
]
help = "Run unit testing and generate coverage report"
args = [
  { name = "directory", default = "docs/exported", help = "Where to look for required input files, and where to put output artifacts" }
]

# Use 'git ls-remote' to get the authoritative list of tags directly from the remote.
# This is non-destructive and ignores any potentially stale or incorrect local tags.
# The pipeline of commands does the following:
# 1. ls-remote: Gets all remote tags.
# 2. awk/sed: Extracts just the tag names (e.g., "v1.2.3").
# 3. sort -V: Sorts the versions correctly.
# 4. tail -n 1: Gets the last (highest) version.
[tool.poe.tasks.get-latest-tag]
shell = "git ls-remote --tags --refs origin | awk '{print $2}' | sed 's:^refs/tags/::' | sort -V | tail -n 1 || echo '0.0.0'"
help = "Fetch the highest version tag from the remote registry."
executor = "simple"


# Build the documentation. If using Gitlab, pushing these docs is built directly into the CI pipeline.
# Note, this requires the `test` task output.
[tool.poe.tasks.docs]
shell = """
  cp README.md docs/index.md
  cp LICENSE.md docs/
  cp CONTRIBUTING.md docs/
  mkdocs build ${verbose:+ -v}
"""
help = "Build docs (make sure to first run the `test` task)."
args = [
  { name = "verbose", type = "boolean", help = "True for verbose output" },
]

# Tags a new version of the documentation.
# Explanation: think of mike as making structural changes to the `public` directory to support
# versioning. If called with no `--push` flag, it simply commits these changes to the specified branch, so you can check those out manually.
[tool.poe.tasks.docs-version]
shell = """
  # 1. Use our new authoritative task
  CURRENT=$(poe get-latest-tag)
  echo "Found most current tag: $CURRENT"

  # 2. Extract Major.Minor (e.g., v1.2.3 -> 1.2)
  # ${CURRENT#v} removes the 'v'
  # cut -d. -f1,2 grabs the first two segments
  VERSION=$(echo ${CURRENT#v} | cut -d. -f1,2)

  echo "Deploying docs for version: $VERSION"

  # 3. Run mike
  mike deploy ${prefix:+ --deploy-prefix ${prefix}} ${remote:+ -r ${remote}} ${branch:+ -b ${branch}} ${push:+ --push} -F mkdocs.yaml -u $VERSION latest
  mike set-default ${prefix:+ --deploy-prefix ${prefix}} ${remote:+ -r ${remote}} ${branch:+ -b ${branch}} latest
"""
help = """Updates the docs version. Make sure to build the docs first with `docs` task."""
args = [
  { name = "prefix", help = "Optional, directory name where to put deployed docs" },
  { name = "remote", help = "Optional, the remote where to push" },
  { name = "branch", help = "Optional, the branch where to push" },
  { name = "push", type = "boolean", help = "Whether to push changes directly with mike." },
]


# Bumps the version tag for the request version part.
# Optionally annotates the resulting Git tag with a descriptive string.
# Note here: https://stackoverflow.com/a/27154277
# If no branch is specified, creating a git tag identifies tags the HEAD of the *current* branch.
[tool.poe.tasks.bump-version-tag]
shell = """
  set -e
  LATEST_TAG=$(poe get-latest-tag)
  CURRENT=${LATEST_TAG:-v0.0.0}
  echo "Found most current tag: $CURRENT"
  BASE=$(echo $CURRENT | sed 's/^v//')
  IFS='.' read -r major minor patch <<< "$BASE"
  case $part in
    "major")
      major=$((major + 1))
      minor=0
      patch=0
      ;;
    "minor")
      minor=$((minor + 1))
      patch=0
      ;;
    "patch")
      patch=$((patch + 1))
      ;;
    *)
      echo "Invalid part: $part. Use 'major', 'minor', or 'patch'."
      exit 1
      ;;
  esac
  BUMPED=$major.$minor.$patch
  git tag v$BUMPED ${annotate:+ --annotate --message="Version $BUMPED"}
  echo "Bumped version $BASE -> $BUMPED"

  #If in GitLab CI, update the environment file for downstream jobs
  if [ -n "$CI_JOB_ID" ]; then
    echo "BUMPED_VERSION=$BUMPED" >> version.env
    echo "BUMPED_TAG=v$BUMPED" >> version.env
  fi
  """
help = """Bump the git version tag. Don't forget to push when necessary: `git push --tags <git repo with oauth credentials"""
args = [
  { name = "part", positional = true, required = true, help = "One of: patch, minor, major." },
  { name = "annotate", type = "boolean", help = "If true, annotates the tag with the descriptive string." },
]
executor = "simple"
